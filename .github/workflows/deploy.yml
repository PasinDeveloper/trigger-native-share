name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /trigger-native-share
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/trigger-native-share
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create Pages with GitHub Actions source; ignore 409 if it already exists.
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f build_type=workflow || true
          # Update Pages to use GitHub Actions as the source.
          # This will surface any real permission or API errors.
          gh api --method PUT /repos/${{ github.repository }}/pages \
            -f build_type=workflow

      - id: deployment
        uses: actions/deploy-pages@v4
